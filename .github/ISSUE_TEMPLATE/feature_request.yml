name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who hits this problem, and when?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - PC storefront
        - Admin console
        - AI providers
        - Payments
        - Deployment
        - Documentation
        - Other
    validations:
      required: true
